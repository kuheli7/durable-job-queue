[project]
name = "job-queue"
version = "0.1.0"
description = "Durable Postgres-backed job queue: API + workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
packages = ["app", "partner_mock"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "partner_mock", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["soak: long-running randomized test (run with -m soak)"]
addopts = "-m 'not soak' -ra"
